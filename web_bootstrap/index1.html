<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าหลัก</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh-100">

    <!---menu-->
    <div id="menu-container"></div>
    
    <!---content-->
    <div class="alert alert-success" role="alert">หน้าหลัก</div>
    <div class="alert alert-success" role="alert">Arnon Meesri</div>

    <div class="mb-4 text-end container">
        <a class="btn btn-outline-info" href="https://www.google.com/">google</a>
    </div>

    <div class="container text-center mb-5">
        <div class="row">
          <div class="col-sm-4 bg-primary-subtle p-3 rounded-start">
            <h3>แมว</h3>
            <img src="/web_bootstrap/img/500iq.jpg" class="img-fluid rounded" alt="แมว 1">
          </div>

          <div class="col-sm-4 bg-warning-subtle p-3">
            <h3>แมว</h3>
            <img src="cat1.jpg" class="img-fluid rounded" alt="แมว 2">
          </div>
          
          <div class="col-sm-4 bg-info-subtle p-3 rounded-end">
            <h2>ลงทะเบียน</h2>
            <form>
                <div class="mb-3 text-start">
                  <label for="E-mail1" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="E-mail1">
                </div>

                <div class="mb-3 text-start">
                  <label for="pw" class="form-label">Password</label>
                  <input type="password" class="form-control" id="pw">
                </div>

                <div class="mb-3 text-start">
                    <label for="Fristname" class="form-label">Firstname</label>
                    <input type="text" class="form-control" id="Fristname" required placeholder="name">
                </div>

                <div class="mb-3 text-start">
                    <label for="Lastname" class="form-label">Lastname</label>
                    <input type="text" class="form-control" id="Lastname" required placeholder="name">
                </div>

                <div class="mb-3 text-start">
                    <label for="Telephone" class="form-label">Telephone</label>
                    <input type="text" class="form-control" id="Telephone" required placeholder="xxxxxx-xxxxx">
                </div>

                <div class="mb-3 text-start">
                    <select class="form-select" aria-label="Default select example">
                        <option selected>กดเพื่อเลือกจังหวัด</option>
                        <option value="Rayong">Rayong</option>
                        <option value="chonburi">Chonburi</option>
                        <option value="Pattaya">Pattaya</option>
                    </select>
                </div>

                <div class="mb-3 text-center">
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <button type="reset" class="btn btn-warning">Cancel</button>
                </div>
            </form>
          </div> 
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ส่วน Footer (ด้านล่างสุด) -->
    <!-- ========================================== -->
    <footer class="bg-dark text-white mt-auto py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start mb-2 mb-md-0">
                    <h5 class="mb-1">SPU chonburi</h5>
                    <p class="mb-0 text-white-50">Arnon Meesri</p>
                </div>
                <div class="col-md-6 text-center text-md-end">
                    <p class="mb-0 text-white-50">&copy; 2026 All Rights Reserved.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Script สำหรับ Bootstrap และ Menu -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/web_bootstrap/menu.js"></script>
</body>
</html>
